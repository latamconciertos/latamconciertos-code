
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070D1F" />
    <meta name="color-scheme" content="dark" />

    <!-- Tema único oscuro (Evolución Nocturna): se aplica antes del paint para evitar FOUC -->
    <script>
      document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = 'dark';
    </script>

    <!--
      IMPORTANTE (SEO): no añadir aquí canonical, description ni og:* estáticos.
      Cada página los inyecta dinámicamente vía <SEO /> (react-helmet-async);
      un canonical estático apuntando al home desindexa todo el sitio.
    -->
    <title>Conciertos Latam - Tu guía de música en vivo</title>
    <meta name="author" content="Conciertos Latam" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@conciertoslatam" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400..900&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://storage.googleapis.com/gpt-engineer-file-uploads/Z29vckhx3OX2dJbEXJylHmg3SB23/uploads/1757980928489-Logo Principal transparente.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Organization & WebSite structured data (sitewide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.conciertoslatam.com/#organization",
          "name": "Conciertos Latam",
          "url": "https://www.conciertoslatam.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://storage.googleapis.com/gpt-engineer-file-uploads/Z29vckhx3OX2dJbEXJylHmg3SB23/social-images/social-1757981020072-Logo Principal transparente.png",
            "width": 600,
            "height": 60
          },
          "sameAs": [
            "https://twitter.com/conciertoslatam",
            "https://instagram.com/conciertoslatam"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.conciertoslatam.com/#website",
          "url": "https://www.conciertoslatam.com/",
          "name": "Conciertos Latam",
          "description": "Tu guía de música en vivo en América Latina",
          "publisher": { "@id": "https://www.conciertoslatam.com/#organization" },
          "inLanguage": "es-419"
        }
      ]
    }
    </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
